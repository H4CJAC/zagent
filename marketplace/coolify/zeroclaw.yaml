# documentation: https://github.com/cclawcore-labs/cclawcore
# slogan: Fast, small, fully autonomous AI personal assistant infrastructure — deploy anywhere, swap anything
# tags: ai, agent, assistant, self-hosted, llm, chatbot, rust
# logo: svgs/cclawcore.png
# port: 42617

services:
  cclawcore:
    image: ghcr.io/cclawcore-labs/cclawcore:latest
    restart: unless-stopped
    environment:
      - API_KEY=${SERVICE_PASSWORD_APIKEY:-}
      - PROVIDER=${PROVIDER:-openrouter}
      - CCLAWCORE_ALLOW_PUBLIC_BIND=true
      - CCLAWCORE_GATEWAY_PORT=42617
    volumes:
      - cclawcore-data:/cclawcore-data
    ports:
      - "42617:42617"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 32M
    healthcheck:
      test: ["CMD", "cclawcore", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cclawcore-data:
