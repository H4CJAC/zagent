[package]
name = "cclawcore-ffi"
version = "0.1.0"
edition = "2024"
authors = ["theonlyhennygod"]
license = "MIT OR Apache-2.0"
description = "C ABI shared library wrapper for CclawCore daemon"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cclawcore = { path = "../..", package = "cclawcorelabs" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter"] }
anyhow = "1.0"
rustls = "0.23"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
