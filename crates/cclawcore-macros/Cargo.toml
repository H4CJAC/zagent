[package]
name = "cclawcore-macros"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Proc macros for CclawCore (config field derivation)"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
